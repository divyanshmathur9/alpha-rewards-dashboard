services:
  postgres:
    image: postgres:18
    container_name: alpha-rewards-postgres
    environment:
      POSTGRES_DB: alpha_rewards
      POSTGRES_USER: alpha_app
      POSTGRES_PASSWORD: alpha_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpha_app -d alpha_rewards"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

